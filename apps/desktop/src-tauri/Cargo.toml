[package]
name = "ets-vibes"
version = "0.1.0"
edition = "2021"
description = "ETS Vibes - Desktop application"

[lib]
name = "ets_vibes_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
chrono = "0.4"
dirs = "6"
hex = "0.4"
aes = "0.9"
cbc = "0.2"
cipher = "0.5"
flate2 = "1.1"
hmac = "0.13"
sha2 = "0.11"
getrandom = "0.2"
regex = "1"
