name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate changelog entry
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          awk "BEGIN{flag=0} /^## ets-vibes@${VERSION}/{flag=1; next} /^## ets-vibes@/{if(flag) exit} /^# Changelog/{if(flag) exit} flag" CHANGELOG.md | sed '/./,$!d' > release-notes-temp.md
          if [ ! -s release-notes-temp.md ]; then
            echo "No changelog entry found for ${TAG}, creating empty notes"
            echo "Release ${TAG}" > release-notes-temp.md
          fi
      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-notes-temp.md \
            --verify-tag || echo "Release already exists, skipping creation"

  build:
    needs: [create-release]
    name: tauri-bundle (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: pnpm install --frozen-lockfile

      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libxdo-dev

      - name: Install Rust target (macOS x86_64)
        if: matrix.target == 'x86_64-apple-darwin'
        run: rustup target add x86_64-apple-darwin

      - run: pnpm tauri build --target ${{ matrix.target }}

      - name: Upload bundles to Release
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          BUNDLE_DIR="target/${{ matrix.target }}/release/bundle"
          find "$BUNDLE_DIR" -type f \( -name "*.dmg" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.msi" -o -name "*.exe" \) -exec gh release upload "$TAG" --clobber {} +
