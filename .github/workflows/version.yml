name: Version Packages
on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  manage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      has_notes: ${{ steps.check.outputs.has_notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check
        run: |
          files=$(ls release-notes/*.md 2>/dev/null | grep -v README.md | head -1)
          if [ -n "$files" ]; then
            echo "has_notes=true" >> $GITHUB_OUTPUT
          else
            echo "has_notes=false" >> $GITHUB_OUTPUT
          fi

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libglib2.0-dev

      - run: pnpm install --frozen-lockfile

      - name: Bump versions
        if: steps.check.outputs.has_notes == 'true'
        run: |
          pnpm bump
          cargo generate-lockfile

      - name: Create Version Packages PR
        if: steps.check.outputs.has_notes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEW_VERSION=$(grep '^version = "' apps/desktop/src-tauri/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          BRANCH="release/v${NEW_VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "chore: release v${NEW_VERSION}"
          git push origin "$BRANCH" --force

          gh pr create \
            --title "Version Packages v${NEW_VERSION}" \
            --body "This PR was automatically generated. Merge it to trigger the release build." \
            --head "$BRANCH" \
            --base main || true

      - name: Tag and release current version if not already tagged
        if: steps.check.outputs.has_notes == 'false'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          VERSION=$(grep '^version = "' apps/desktop/src-tauri/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          TAG="v${VERSION}"
          LATEST=$(git tag --list 'v*' --sort=-version:refname | head -1)
          if [ -z "$LATEST" ] || [ "$LATEST" != "$TAG" ]; then
            git config --unset-all http.https://github.com/.extraheader || true
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git tag "$TAG"
            git push origin "$TAG"
            echo "Tagged $TAG"
          else
            echo "Tag $TAG already exists, skipping"
          fi
