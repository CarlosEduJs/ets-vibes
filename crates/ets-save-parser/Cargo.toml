[package]
name = "ets-save-parser"
version = "0.1.0"
edition = "2021"
description = "Parser for ETS2 save files (.sii)"

[dependencies]
ets-core = { path = "../ets-core" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
aes = "0.9"
cbc = "0.2"
cipher = "0.5"
flate2 = "1.1"
hmac = "0.13"
sha2 = "0.11"
getrandom = "0.2"
regex = "1"
